{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taskly | Home</title>
    <link rel="shortcut icon" href="{% static 'image/favicon.png' %}" type="image/x-icon">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  </head>
  <body class='home'>
    <div class='overlay'>
       <nav class="navbar "> 
      <div class="container" style='height:80px;'>
        <a class="navbar-brand "><img src="{% static 'image/logo.png' %}" alt="" class="mb-4" style="width: 150px; height: auto;"></a>
        <form class="d-flex" role="search">
          <button class="btn btn-primary " type="submit" style='vertical-align: top;'>
            <a href="{% url 'tasks:login' %}" class="text-decoration-none text-white"
              >Sign in</a
            >
          </button>
        </form>
      </div>
    </nav>
    

    <main  class="container-fluid">
        
    
    

      {% block content %}
        <div class='hero text-center' >
            {% comment %} <img src="{% static 'image/main.png' %}" alt="Taskly" width='150px' height='auto'> {% endcomment %}
            <h3>Your goals. Your tasks. Your next big win.</h3>
            <p>Take control of your day with one simple platform. Organize your tasks, manage your projects, and turn your plans into real progress.</p>
            <br><br>
            <div style="width: 100%">
              <form action="{% url 'tasks:register' %}" method="get" class="get-started-form">
                <input
                  type="email"
                  name="email"
                  placeholder="Email address"
                  class="form"
                  aria-label="Email address"
                  autocomplete="email"
                  required
                />
                <button type="submit" class="btn btn-primary btn-lg">
                  Get Started &rarr;
                </button>
              </form>
            </div>
        </div>


  
</div>
{% endblock %}

     
    </main>
<div class="bottom-curve"></div>
    </div>
    
    
   
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
