<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My Tasks</h1>

    <a href="{% url 'create_task' %}"> Add Task</a>
    <hr>

    
    {% for task in tasks  %}
    <h3>{{task.title}}</h3>
    <p>{{task.description}}</p>
    
    {% if task.completed %}
    <strong>Completed</strong>
    {% else %}
    <strong>Pending</strong>  
    <a href="{% url 'complete_task' task.id %}">Complete</a>      
    {% endif %}
        
    <hr>
    {%empty%}
    <p>No task yet</p>   
    {% endfor %}
        
</body>
</html>
